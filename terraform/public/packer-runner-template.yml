packer-runner-template:
  description: "Opinionated thin-runner template for Packer image-build repositories that overlay consumer inventory onto a SHA-pinned packer-framework. Data-only by design — runners own packer inventory and caller workflows; the framework owns executable build logic."
  visibility: "public"
  is_template: true
  codeowners: |
    * @NWarila
  topics:
    - packer
    - template
    - project-template
    - infrastructure-as-code
    - ci-cd
    - devsecops
    - best-practices
    - hashicorp
    - runner
    - image-building
  required_checks:
    - "contract validator"
