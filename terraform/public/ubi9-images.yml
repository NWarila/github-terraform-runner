ubi9-images:
  description: "UBI 9 image family: twelve hardened, byte-for-byte reproducible images built from positive package lists."
  visibility: "public"
  is_template: false
  # The file Terraform writes to .github/CODEOWNERS on main. It must equal the
  # file the repository already carries, or every apply commits a change.
  codeowners: |
    # Review ownership. Every path, and the workflow directory explicitly.
    * @NWarila
    /.github/workflows/ @NWarila
  topics:
    - ubi9
    - rhel9
    - container-images
    - fips
    - hardened
    - reproducible-builds
  # No required_checks while the image family is rebuilt: the previous
  # pipeline's contexts no longer report. Of today's contexts, only
  # "template-drift / run / check" reports on every pull request (the build
  # matrix is path-filtered); it stays advisory until the repository's gate
  # set is designed as one piece, so nothing is required yet. A required
  # context that does not report blocks the pull request.
