ubi9-ansible-runner:
  description: "Hardened UBI9 Ansible execution-environment image: runs deploy playbooks on ARC in the Talos cluster and extracts per-repo secrets from HashiCorp Vault via GitHub-OIDC JWT auth. FROM ubi9-base-python, SLSA-L3, cosign keyless signing, per-repo least-privilege secret access."
  visibility: "public"
  is_template: false
  codeowners: |
    # Purpose: Code review ownership; @NWarila owns all.
    # Role: governance

    * @NWarila
  topics:
    - ubi9
    - rhel9
    - ansible
    - execution-environment
    - vault
    - hardened
    - supply-chain-security
    - cosign
  # Opt-in required status checks. The framework injects these contexts into the
  # Pull Request Gate ruleset, making the CI gate suite merge-blocking. Names are
  # the exact check contexts GitHub reports on pull requests. Only contexts that
  # already exist may be listed; a name that never reports would deadlock merges.
  required_checks:
    - "pre-commit"
