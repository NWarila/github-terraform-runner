ubi9-base-micro:
  description: "Hardened UBI9 micro base image with FIPS, STIG, and SLSA-L3 supply-chain evidence."
  visibility: "public"
  is_template: false
  codeowners: |
    # Purpose: Code review ownership; @NWarila owns all, with vex/ and stig/ evidence dirs gated.
    # Role: governance
    # Micro-container candidate: no (review-ownership policy, not gate logic)

    * @NWarila
    /vex/ @NWarila
    /stig/ @NWarila
  topics:
    - ubi9
    - rhel9
    - base-image
    - micro
    - fips
    - hardened
  # Opt-in required status checks. The framework injects these contexts into the
  # Pull Request Gate ruleset (do_not_enforce_on_create=true, non-strict), making
  # the CI gate suite merge-blocking. Names are the exact check contexts GitHub
  # reports on pull requests; publish-only jobs (publish signed image, rekor
  # roll-up, slsa l3 provenance) skip on PRs and are deliberately excluded.
  required_checks:
    - "actionlint"
    - "analyze Python tools"
    - "build and hardening"
    - "CodeQL"
    - "dependency review"
    - "pre-commit"
    - "python / required"
    - "repo contract"
    - "reproducibility gate (amd64)"
    - "reproducibility gate (arm64)"
    - "slsa generator tag integrity"
    - "zizmor"
