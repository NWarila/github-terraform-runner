ubi9-application-template:
  description: "Canonical template for Red Hat UBI 9 application image repositories that build minimal ubi-micro OCI images from pinned inputs (UBI base @sha256 + NVR-pinned dnf packages), with SBOM/provenance, Sigstore signing evidence, OpenSCAP RHEL9 STIG scoring, and runtime hardening checks."
  visibility: "public"
  is_template: true
  codeowners: |
    * @NWarila
  advisory_checks:
    - "template verify"
  topics:
    - ubi9
    - rhel9
    - red-hat
    - ubi-micro
    - containers
    - template
    - project-template
    - oci-images
    - ci-cd
    - devsecops
    - best-practices
    - supply-chain-security
    - sbom
    - provenance
    - sigstore
    - cosign
    - container-hardening
