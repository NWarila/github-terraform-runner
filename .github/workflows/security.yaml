name: Security

# One visible security entrypoint. Detailed implementations live in
# terraform-runner-template and are consumed here by immutable SHA.

on:
  branch_protection_rule:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  iac:
    name: IaC and secret scan
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: NWarila/terraform-runner-template/.github/workflows/reusable-iac-security.yaml@f85a0a61b6650c572cf5971abc8b0caa11999087

  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: NWarila/terraform-runner-template/.github/workflows/reusable-codeql.yaml@f85a0a61b6650c572cf5971abc8b0caa11999087

  scorecard:
    name: OpenSSF Scorecard
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
    uses: NWarila/terraform-runner-template/.github/workflows/reusable-scorecard.yaml@f85a0a61b6650c572cf5971abc8b0caa11999087
