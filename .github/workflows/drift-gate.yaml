name: Drift Gate

# Verifies that this runner mirrors both the org-owned baseline files from
# NWarila/.github and the contract-critical scaffold from
# NWarila/terraform-runner-template at pinned SHAs.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: drift-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  org-baseline:
    name: org-baseline / verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drift gate (org baseline)
        # renovate: datasource=git-refs depName=NWarila/drift-gate
        uses: NWarila/drift-gate@a29b46ba971b55956994d51684c44d6861f7b4bf # main @ 2026-05-11
        with:
          source-repo: NWarila/.github
          # renovate: depName=NWarila/.github packageName=NWarila/.github currentValue=main
          source-ref: 343a61a1c6acdf2d243a01819cd07eb954190bc1 # org baseline manifest @ 2026-05-25
          manifest: baseline-manifest.json
          check-name: org-baseline / verify

  runner-template:
    name: runner-template / verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drift gate (runner template baseline)
        # renovate: datasource=git-refs depName=NWarila/drift-gate
        uses: NWarila/drift-gate@a29b46ba971b55956994d51684c44d6861f7b4bf # main @ 2026-05-11
        with:
          source-repo: NWarila/terraform-runner-template
          # renovate: depName=NWarila/terraform-runner-template packageName=NWarila/terraform-runner-template currentValue=main
          source-ref: 97dec3587e3e24890adda1097c64c6d0bd5c7696
          manifest: baseline-manifest.json
          check-name: runner-template / verify
