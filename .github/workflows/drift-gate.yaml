name: Drift Gate

# Verifies that this runner mirrors the contract-critical scaffold from
# NWarila/terraform-runner-template at the pinned template SHA.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: drift-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-template:
    name: runner-template / verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drift gate (runner template baseline)
        # renovate: datasource=git-refs depName=NWarila/drift-gate
        uses: NWarila/drift-gate@a29b46ba971b55956994d51684c44d6861f7b4bf # main @ 2026-05-11
        with:
          source-repo: NWarila/terraform-runner-template
          # renovate: depName=NWarila/terraform-runner-template packageName=NWarila/terraform-runner-template currentValue=main
          source-ref: b6a74281dea86ea8e3c455861bb4d654f94bf26a
          manifest: baseline-manifest.json
          check-name: runner-template / verify
