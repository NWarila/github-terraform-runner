name: Auto-Merge

# Enables GitHub auto-merge on trusted-bot PRs. The Pull Request Gate ruleset
# (review + code-owner + thread resolution) still gates the merge; no required
# status checks are configured on this repo, so auto-merge does NOT wait for CI.
# Kept separate from release.yaml so pull_request_target has one narrow,
# reviewable purpose.

on:
  # zizmor: ignore[dangerous-triggers] ADR-template/0004 + OPA; no PR checkout.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    permissions:
      contents: write
      pull-requests: write
    uses: NWarila/.github/.github/workflows/reusable-auto-merge.yaml@f25a0e36f0591687862ff78f9f7b9d94fe577bc7
