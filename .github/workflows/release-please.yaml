name: Release Please
# Caller for nwarila/terraform-template reusable-release-please workflow.
# Renovate manages the SHA pin. The reusable always dispatches
# release-evidence.yaml on every release; no per-repo configuration is
# needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    uses: NWarila/terraform-template-template/.github/workflows/reusable-release-please.yaml@ed6afcd1efe42c98c881574ebe8994212c6db832
