name: Deploy GitHub Terraform

# Calls the nwarila-platform/github-terraform-framework reusable deploy
# workflow. Per-runner specifics live in this file and in repository Variables
# and Secrets:
#
#   secrets.AWS_ROLE_TO_ASSUME              full IAM role ARN for OIDC
#   secrets.AWS_REGION                      e.g. us-east-1
#   secrets.AWS_S3_BUCKET                   tfstate backend + private-repo source bucket
#   secrets.FINE_GRAINED_PERSONAL_ACCESS_TOKEN  GH PAT for Terraform
#
#   private_repos_prefix       S3 prefix synced before deploy. Matching
#                              *.yml/*.yaml files are copied into
#                              terraform/private/ and overlaid with any
#                              committed private inventory.
#
# github_owner is derived from ${{ github.repository_owner }}; the reusable
# workflow and framework revision remain explicitly pinned for this runner.

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply (default: plan-only audit)"
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
  # Required by the reusable workflow's drift issue lifecycle.
  issues: write

concurrency:
  group: tf-${{ github.event.repository.name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: nwarila-platform/github-terraform-framework/.github/workflows/reusable-terraform-deploy.yaml@22378bbda8887a7b03dbf6b59950d7097f0e16e9
    with:
      github_owner: ${{ github.repository_owner }}
      # Renovate keeps this in lockstep with the uses: SHA above.
      # renovate: depName=nwarila-platform/github-terraform-framework packageName=nwarila-platform/github-terraform-framework currentValue=main
      framework_ref: 22378bbda8887a7b03dbf6b59950d7097f0e16e9
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.*)$ versioning=hashicorp
      terraform_version: "1.15.4"
      # Preserve the existing S3 source layout while the runner-local inventory
      # path moves to terraform/private.
      private_repos_prefix: nwarila/github-terraform-runner/repos
      apply: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || false }}
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      aws_region: ${{ secrets.AWS_REGION }}
      backend_bucket: ${{ secrets.AWS_S3_BUCKET }}
      gh_token: ${{ secrets.FINE_GRAINED_PERSONAL_ACCESS_TOKEN }}
