name: State Rebind (terraform-template rename)

# One-shot workflow that rebinds Terraform state addresses from
# "terraform-template" to "terraform-template-template" after the
# corresponding GitHub-side rename. Run this MANUALLY via
# workflow_dispatch BEFORE merging the chore/standardize-fleet-bead9a4
# branch to main; the merge triggers terraform-deploy.yaml on push, and
# without the rebind the plan would propose destroy + create on the
# renamed repo.
#
# Behavior
# --------
# 1. Initialize Terraform against the runner's S3 state.
# 2. List every state address keyed exactly by ["terraform-template"].
# 3. For each address, run `terraform state mv` to the equivalent
#    address keyed by ["terraform-template-template"].
# 4. Print the final terraform-template-related state list for visual
#    confirmation.
#
# Idempotent: a second run is a no-op (no state addresses still match
# the old key).
#
# Cleanup
# -------
# DELETE this workflow file (and its allowlist entry in .gitignore)
# in a follow-up PR after a successful run. It exists only for this
# one-time rename.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: state-rebind-rename
  cancel-in-progress: false

jobs:
  rebind:
    name: Rebind Terraform state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Initialize temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Check out github-terraform-framework
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: nwarila-platform/github-terraform-framework
          # Pinned to the framework SHA in the runner's terraform-deploy.yaml.
          # Update if you bump terraform-deploy's pin first.
          ref: 40d21e78004ae11e3a2cb4b2d9319643e114743b
          path: framework
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.*)$ versioning=hashicorp
          terraform_version: "1.15.1"
          terraform_wrapper: false

      - name: Terraform init (runner state backend)
        working-directory: framework/terraform
        env:
          BACKEND_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          terraform init \
            -backend-config="bucket=${BACKEND_BUCKET}" \
            -backend-config="encrypt=true" \
            -backend-config="key=nwarila/github-terraform-runner/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: Rebind state addresses from terraform-template -> terraform-template-template
        working-directory: framework/terraform
        run: |
          set -euo pipefail

          # Find every state address whose for_each key is exactly
          # "terraform-template". The grep pattern matches `["terraform-template"]`
          # specifically, so it does NOT match `["terraform-template-template"]`
          # or any partial substring.
          old_addrs="$(terraform state list 2>/dev/null | grep -E '\["terraform-template"\]' || true)"

          if [ -z "${old_addrs}" ]; then
            echo "::notice::No state entries with key [\"terraform-template\"] remain — already rebound or never present. Exiting clean."
            exit 0
          fi

          echo "Found state entries to rebind:"
          printf '  %s\n' ${old_addrs}
          echo ""

          while IFS= read -r old_addr; do
            new_addr="${old_addr/\"terraform-template\"/\"terraform-template-template\"}"
            echo "::group::${old_addr} -> ${new_addr}"
            terraform state mv "${old_addr}" "${new_addr}"
            echo "::endgroup::"
          done <<< "${old_addrs}"

      - name: Final state list (terraform-template* entries)
        working-directory: framework/terraform
        run: |
          echo "=== state entries matching 'terraform-template' (post-rebind) ==="
          terraform state list | grep terraform-template || echo "(none)"
